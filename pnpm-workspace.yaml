packages:
  - 'apps/*'
  - 'packages/*'
  - 'game'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true

# The same list for pnpm 10, which Vercel uses.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma

# Patched releases of transitive dependencies (see docs/SECURITY.md).
overrides:
  multer: ^2.5.0
  lodash: ^4.18.1
  js-yaml@4: ^4.3.2
  body-parser@1: ^1.20.9
  qs: ^6.16.1
  effect: ^3.22.1
