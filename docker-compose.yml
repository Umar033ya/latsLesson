# Web, game and API behind one origin: http://localhost:8080 (game at /play/).
# Secrets come from .env; see .env.example.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lastlesson
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: lastlesson
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lastlesson -d lastlesson']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: { context: ., dockerfile: apps/backend/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://lastlesson:${POSTGRES_PASSWORD}@postgres:5432/lastlesson?schema=public
      DATABASE_URL_UNPOOLED: postgresql://lastlesson:${POSTGRES_PASSWORD}@postgres:5432/lastlesson?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      GAME_TOKEN_SECRET: ${GAME_TOKEN_SECRET:?set GAME_TOKEN_SECRET}
      CODE_PEPPER: ${CODE_PEPPER:?set CODE_PEPPER}
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      GAME_URL: ${PUBLIC_URL:-http://localhost:8080}/play/
      TRUST_PROXY: '1'
      SWAGGER_ENABLED: 'false'
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [backend]
    ports: ['8080:80']
volumes:
  pgdata:
