services:
  postgres:
    image: postgres:16-alpine
    container_name: last-lesson-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lastlesson
      POSTGRES_PASSWORD: lastlesson
      POSTGRES_DB: lastlesson
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lastlesson -d lastlesson']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: last-lesson-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lastlesson:lastlesson@postgres:5432/lastlesson?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: last-lesson-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'
volumes:
  pgdata:
